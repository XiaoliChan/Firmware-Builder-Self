name: Build ppe-nss Redmi AX6

# openwrt-ppe-nss@ppe-nss(OpenWrt main 6.18 + 主线 qca_ppe/qca_edma 驱动)+ nss-packages@ppe-nss
# (nss-firmware)+ luci fork(luci-app-qca-ppe-qos)。模型:有线 offload 走 PPE(fw4 flowtable /
# switchdev / tc),Wi-Fi 数据面走 NSS 固件(nss-wifi-drv,默认开,uci nss-wifi.general.offload 可关)。
# 单设备 redmi_ax6,sysupgrade-only;seed 模式同 immortalwrt.yml。
# 旧 vendor NSS 线(qca-nss-drv/ECM/sqm-nss)已随上游归档,见 tag archive/nss-edma-rework-final。
#
# 与上游 build-flavour.yml 的刻意差异(他们的多用户基建,单设备自用不抄):
#   per-release kmod feed 发布 GitHub Pages + /etc/ppe-release + APK 签名、
#   ALL_KMODS/ImageBuilder 产物、ccache(我们用 toolchain 周缓存)、check-updates 跳过。
# 其余构建步骤(feeds/patch/符号校验/IGNORE_ERRORS/重试下载)与上游一致。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'configs/redmi-ax6-ppe-nss.seed'
      - 'configs/redmi-ax6-ppe-nss.files/**'
      - 'configs/feeds.nss'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/ppe-nss-redmi-ax6.yml'

concurrency:
  group: ppe-nss-redmi-ax6
  cancel-in-progress: true

permissions:
  contents: write

env:
  UPSTREAM_REPO: JuliusBairaktaris/openwrt-ppe-nss
  UPSTREAM_REF: ppe-nss
  TARGET_DIR: qualcommax/ipq807x

jobs:
  build:
    name: redmi-ax6
    runs-on: ubuntu-26.04 # 上游同款:apt 依赖列表按此 runner 钉住
    timeout-minutes: 350
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y bzip2 g++ gawk gcc git glibc-source libncurses-dev make rsync

      - name: Free disk space
        # 完整配方,与 immortalwrt.yml 一致(防 Go/LTO 大件爆盘)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/share/boost \
            /usr/share/dotnet /usr/local/share/powershell \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/lib/node_modules /usr/local/share/chromium \
            /opt/az /opt/google /opt/microsoft /usr/lib/jvm /snap \
            2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /mnt/swapfile 2>/dev/null || true
          df -h /

      # 顺序必须:builder 根目录先 checkout,源码目录后 checkout。
      # 反过来时 checkout 到根会 git clean -ffdx,把已 checkout 的 openwrt/ 清掉。
      - name: Checkout builder repo
        uses: actions/checkout@v7

      - name: Checkout openwrt-ppe-nss
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          fetch-depth: 1
          path: openwrt

      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # key 换新线前缀,restore-keys 兜到旧 nss-redmi-ax6 缓存,首次构建不全冷启
      - name: Restore dl/ cache
        uses: actions/cache/restore@v6
        with:
          path: openwrt/dl
          key: dl-ppe-nss-redmi-ax6-${{ steps.week.outputs.week }}
          restore-keys: |
            dl-ppe-nss-redmi-ax6-
            dl-nss-redmi-ax6-

      - name: Restore toolchain cache (weekly)
        uses: actions/cache/restore@v6
        with:
          path: |
            openwrt/staging_dir/toolchain*
            openwrt/staging_dir/host*
            openwrt/build_dir/toolchain*
            openwrt/build_dir/host*
          key: toolchain-ppe-nss-redmi-ax6-${{ steps.week.outputs.week }}
          restore-keys: |
            toolchain-ppe-nss-redmi-ax6-
            toolchain-nss-redmi-ax6-

      - name: seed → .config
        run: bash scripts/prepare-build.sh configs/redmi-ax6-ppe-nss.seed openwrt configs/feeds.nss --files configs/redmi-ax6-ppe-nss.files

      # ccache key 覆盖所有工具链输入(上游 Builder 同款):toolchain 目录树哈希 +
      # 工具链相关 config 行 + 本机 gcc/as 版本,任一变化都从空缓存开始
      - name: Compute ccache key
        id: ccache
        run: |
          tree=$(git -C openwrt rev-parse HEAD:toolchain)
          sum=$({
            echo "$tree"
            grep -E '^CONFIG_(BINUTILS|GCC|LIBC|MUSL|GLIBC)_' openwrt/.config
            gcc --version; as --version
          } | sha256sum | cut -c1-16)
          echo "prefix=ccache-ppe-nss-redmi-ax6-$sum-" >>"$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: openwrt/.ccache
          key: ${{ steps.ccache.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.ccache.outputs.prefix }}

      - name: Set reproducible-build env
        working-directory: openwrt
        run: |
          {
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "TZ=UTC"
            echo "LC_ALL=C"
            echo "KBUILD_BUILD_USER=builder"
            echo "KBUILD_BUILD_HOST=github"
          } >>"$GITHUB_ENV"

      - name: Download sources
        working-directory: openwrt
        run: |
          for attempt in 1 2 3; do
            make download -j"$(nproc)" V=s && break
            echo "Download attempt $attempt failed; retrying..."
            sleep 5
          done

      # IGNORE_ERRORS=m 与上游一致:=m 的包失败跳过不阻塞;镜像内 =y 的包照样硬失败
      # COMPILERCHECK=content:ccache 默认只看编译器版本号,自建 GCC 小改不动版本号会误命中
      - name: Build
        working-directory: openwrt
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 3G
        run: |
          make -j"$(nproc)" IGNORE_ERRORS=m || make -j1 V=s IGNORE_ERRORS=m
          staging_dir/host/bin/ccache -s || true

      # 失败也保存(同 immortalwrt.yml 的拆分模式)
      - name: Save dl/ cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: openwrt/dl
          key: dl-ppe-nss-redmi-ax6-${{ steps.week.outputs.week }}

      - name: Save toolchain cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            openwrt/staging_dir/toolchain*
            openwrt/staging_dir/host*
            openwrt/build_dir/toolchain*
            openwrt/build_dir/host*
          key: toolchain-ppe-nss-redmi-ax6-${{ steps.week.outputs.week }}

      # 每次构建存独立 key,restore-keys 前缀取最新;旧条目靠 GitHub 7 天未用/配额 LRU 回收
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: openwrt/.ccache
          key: ${{ steps.ccache.outputs.prefix }}${{ github.run_id }}

      - name: Collect images
        run: |
          out="out/ppe-nss-redmi-ax6"
          mkdir -p "$out"
          # OpenWrt 镜像文件名中设备 id 用下划线:redmi_ax6;通配符同时罩住两种写法
          find "openwrt/bin/targets/${TARGET_DIR}" -maxdepth 1 -type f \
            -name '*redmi*ax6*' -exec cp {} "$out"/ \;
          grep 'redmi.*ax6' "openwrt/bin/targets/${TARGET_DIR}/sha256sums" >"$out/sha256sums.txt" || true
          cp openwrt/.config "$out/config-full.defconfig"
          cp configs/redmi-ax6-ppe-nss.seed configs/feeds.nss "$out/"
          ls -lh "$out"
          [[ $(find "$out" -name '*sysupgrade*.bin' | wc -l) -gt 0 ]] || { echo '::error::no sysupgrade image'; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ppe-nss-redmi-ax6
          path: out/

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ppe-nss-redmi-ax6-$(date -u +%Y%m%d)"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "ppe-nss Redmi AX6 $(date -u +%F)" \
              --notes "seed: configs/redmi-ax6-ppe-nss.seed @ ${{ github.sha }}
          upstream: $UPSTREAM_REPO@$UPSTREAM_REF (HEAD at build time)

          Wired offload runs in the PPE (fw4 flowtable / switchdev / tc); the
          NSS firmware takes the Wi-Fi data path (on by default; \`uci set nss-wifi.general.offload=0\` to disable). Sysupgrade-only, flash over an existing OpenWrt install."
          fi
          gh release upload "$tag" "out/ppe-nss-redmi-ax6/*" --clobber
